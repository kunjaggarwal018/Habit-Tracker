<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Habit Tracker</h1>
        <p class="intro">Track your habits and complete your daily goals.</p>

        <div class="add">
            <input type="text" id="habitName" placeholder="Enter habit name">

            <input type="text" id="habitGoal" placeholder="Enter your goal">

            <button id="addBtn">Add Habit</button>
        </div>

        <h2>My Habits</h2>

        <div id="habitList"></div>

    </div>

    <script src="script.js"></script>
</body>

</html>
